name: CI

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MaintenanceDesk.Api.Tests/MaintenanceDesk.Api.Tests.csproj

      - name: Build API
        run: dotnet build MaintenanceDesk.Api/MaintenanceDesk.Api.csproj --no-restore

      - name: Run tests
        run: dotnet test MaintenanceDesk.Api.Tests/MaintenanceDesk.Api.Tests.csproj --no-restore --verbosity normal

  web:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenancedesk-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maintenancedesk-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
